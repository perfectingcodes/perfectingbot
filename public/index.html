<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perfectingbot</title>
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --panel2:#171c27; --line:#242b3a;
  --fg:#e6edf3; --dim:#8b95a7; --faint:#5b6479;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#4c8dff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px 20px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:.5px}
.status{font-size:11px;color:var(--dim)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.on{background:var(--ok)}.dot.off{background:var(--faint)}
nav{display:flex;gap:2px;margin-top:12px}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
  padding:8px 14px;cursor:pointer;font:inherit;font-size:12px}
nav button:hover{color:var(--fg)}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel)}
select,input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:5px;padding:5px 8px;font:inherit;font-size:12px}
input[type=search]{min-width:200px}
label{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
main{padding:18px 20px 60px;max-width:1500px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px}
.tile .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.tile .v{font-size:21px;font-weight:600;margin-top:3px}
.tile .v.ok{color:var(--ok)}.tile .v.warn{color:var(--warn)}.tile .v.bad{color:var(--bad)}
.card{border:1px solid var(--line);border-left-width:3px;border-radius:7px;margin-bottom:8px;background:var(--panel)}
.card.SETUP{border-left-color:var(--ok)}.card.WATCH{border-left-color:var(--warn)}.card.REJECT{border-left-color:var(--bad)}
summary{padding:11px 14px;cursor:pointer;display:flex;gap:11px;align-items:center;flex-wrap:wrap;list-style:none}
summary::-webkit-details-marker{display:none}
.badge{font-size:10px;padding:2px 7px;border-radius:3px;letter-spacing:.7px;background:#21262d;color:var(--dim)}
.SETUP .badge{background:rgba(63,185,80,.14);color:var(--ok)}
.WATCH .badge{background:rgba(210,153,34,.14);color:var(--warn)}
.REJECT .badge{background:rgba(248,81,73,.14);color:var(--bad)}
.score{font-size:17px;font-weight:700;min-width:32px;text-align:right}
.sym{font-weight:600}
.chip{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.head{color:var(--dim);flex:1;min-width:220px}
time{color:var(--faint);font-size:11px;white-space:nowrap}
.body{padding:0 14px 14px}
.meta{color:var(--dim);font-size:11px;padding:8px 0 12px;border-top:1px solid var(--line);word-break:break-all}
.tier h4{margin:13px 0 6px;font-size:10px;color:var(--faint);letter-spacing:1.2px;text-transform:uppercase}
.ck{display:flex;gap:9px;padding:3px 0;align-items:baseline}
.ck b{min-width:118px;font-weight:500}.ck .says{color:var(--dim);flex:1}
.mk{width:11px;text-align:center}
.ck.pass .mk{color:var(--ok)}.ck.warn .mk{color:var(--warn)}
.ck.fail .mk{color:var(--bad)}.ck.unknown .mk{color:var(--faint)}
.ck em{color:var(--bad);font-style:normal;font-size:10px;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;letter-spacing:.8px;
  text-transform:uppercase;padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:hover{color:var(--fg)}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel2)}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:var(--ok)}
.spark{display:flex;gap:2px;align-items:flex-end;height:22px}
.spark i{width:5px;border-radius:1px;background:var(--faint)}
.spark i.SETUP{background:var(--ok)}.spark i.WATCH{background:var(--warn)}.spark i.REJECT{background:var(--bad)}
.empty{color:var(--dim);padding:36px 0;text-align:center}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:6px;padding:11px 14px;margin-bottom:16px;color:var(--dim);font-size:12px}
.mono{color:var(--faint);font-size:11px}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>perfectingbot</h1>
    <span class="status" id="status">loading…</span>
  </div>
  <nav id="tabs">
    <button data-tab="opps" aria-selected="true">Opportunities</button>
    <button data-tab="traders" aria-selected="false">Traders</button>
    <button data-tab="tokens" aria-selected="false">Tokens</button>
    <button data-tab="gates" aria-selected="false">Gates</button>
    <button data-tab="config" aria-selected="false">Config</button>
  </nav>
</header>

<div class="filters">
  <label>chain <select id="f-chain"><option value="all">all</option><option>robinhood</option><option>bsc</option></select></label>
  <label>verdict <select id="f-label"><option value="all">all</option><option>SETUP</option><option>WATCH</option><option>REJECT</option></select></label>
  <label>min score <select id="f-score"><option value="0">any</option><option value="45">45+</option><option value="70">70+</option><option value="85">85+</option></select></label>
  <label>window <select id="f-since"><option value="0">all time</option><option value="1">1h</option><option value="6">6h</option><option value="24">24h</option><option value="168">7d</option></select></label>
  <input type="search" id="f-q" placeholder="token, address, or trader…">
  <label><input type="checkbox" id="f-auto" checked> auto-refresh</label>
</div>

<main>
  <div id="view-opps"></div>
  <div id="view-traders" hidden></div>
  <div id="view-tokens" hidden></div>
  <div id="view-gates" hidden></div>
  <div id="view-config" hidden></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MARK = { pass:"✓", warn:"!", fail:"✗", unknown:"?" };
const TIER = { 1:"On-chain truth", 2:"Smart money", 3:"Social" };
const fmtUsd = n => "$" + Math.round(n).toLocaleString();
const ago = t => { const s=(Date.now()-t)/1000;
  if(s<60) return Math.round(s)+"s ago"; if(s<3600) return Math.round(s/60)+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago"; return Math.round(s/86400)+"d ago"; };

let tab = "opps";
let sortState = { traders:{key:"hitRate",dir:-1}, tokens:{key:"lastSeen",dir:-1}, gates:{key:"vetoed",dir:-1} };

function query() {
  const p = new URLSearchParams();
  p.set("chain", $("#f-chain").value);
  p.set("label", $("#f-label").value);
  p.set("minScore", $("#f-score").value);
  p.set("sinceHours", $("#f-since").value);
  const q = $("#f-q").value.trim();
  if (q) p.set("q", q);
  return p.toString();
}
const api = (path) => fetch(`/api/${path}?${query()}`).then(r => r.json());

async function refresh() {
  try {
    const health = await fetch("/api/health").then(r => r.json());
    $("#status").innerHTML =
      `<span class="dot ${health.scanner ? "on":"off"}"></span>` +
      (health.scanner ? `scanner live · mode ${esc(health.mode)}` : `scanner idle — no FOMO_API_KEY`) +
      ` · ${health.evaluations} evaluations`;
  } catch { $("#status").textContent = "server unreachable"; }

  if (tab === "opps") return renderOpps();
  if (tab === "traders") return renderTraders();
  if (tab === "tokens") return renderTokens();
  if (tab === "gates") return renderGates();
  if (tab === "config") return renderConfig();
}

async function renderOpps() {
  const [rows, sum] = await Promise.all([api("setups"), api("summary")]);
  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">evaluations</div><div class="v">${sum.evaluations}</div></div>
    <div class="tile"><div class="k">setups</div><div class="v ok">${sum.setups}</div></div>
    <div class="tile"><div class="k">watch</div><div class="v warn">${sum.watches}</div></div>
    <div class="tile"><div class="k">rejected</div><div class="v bad">${sum.rejects}</div></div>
    <div class="tile"><div class="k">avg score</div><div class="v">${sum.avgScore}</div></div>
    <div class="tile"><div class="k">blind spots / eval</div><div class="v">${sum.blindSpotsPerEval}</div></div>
  </div>`;

  if (!rows.length) { $("#view-opps").innerHTML = tiles + `<div class="empty">No evaluations match these filters.</div>`; return; }

  $("#view-opps").innerHTML = tiles + rows.map(r => {
    const s = r.setup, a = r.assessment;
    const tiers = [1,2,3].map(t => {
      const items = a.evidence.filter(e => e.tier === t);
      if (!items.length) return "";
      const got = items.reduce((x,e)=>x+e.points,0), max = items.reduce((x,e)=>x+e.maxPoints,0);
      return `<div class="tier"><h4>${TIER[t]} — ${got.toFixed(0)}/${max.toFixed(0)} pts</h4>` +
        items.map(e => `<div class="ck ${e.verdict}"><span class="mk">${MARK[e.verdict]}</span>` +
          `<b>${esc(e.name)}</b><span class="says">${esc(e.says)}</span>` +
          `${e.veto && e.verdict==="fail" ? "<em>DISQUALIFYING</em>" : ""}</div>`).join("") + `</div>`;
    }).join("");

    return `<details class="card ${a.label}"${a.label==="SETUP"?" open":""}>
      <summary>
        <span class="badge">${a.label}</span>
        <span class="score">${a.score}</span>
        <span class="sym">${esc(s.token.symbol ?? s.token.address.slice(0,10))}</span>
        <span class="chip">${esc(s.chain)}</span>
        <span class="chip">${s.buyers.length} wallets</span>
        <span class="head">${esc(a.headline)}</span>
        <time>${ago(r.at)}</time>
      </summary>
      <div class="body">
        <div class="meta">${esc(s.token.address)} · bought by ${esc(s.buyers.map(b=>b.handle??b.wallet.slice(0,8)).join(", "))} · lead ${s.leadMs}ms · unit price $${Number(s.priceUsd).toPrecision(4)}</div>
        ${tiers}
      </div></details>`;
  }).join("");
}

function sortRows(rows, which) {
  const { key, dir } = sortState[which];
  return [...rows].sort((a,b) => {
    const x=a[key], y=b[key];
    if (typeof x === "string") return dir * x.localeCompare(y);
    return dir * ((x??0) - (y??0));
  });
}
/** `extra` columns are display-only (not sortable) and must live inside the same row. */
function headers(which, cols, extra = []) {
  const sortable = cols.map(c=>`<th data-sort="${which}:${c.k}">${c.t}${sortState[which].key===c.k ? (sortState[which].dir<0?" ↓":" ↑") : ""}</th>`).join("");
  return `<tr>${sortable}${extra.map(t=>`<th>${t}</th>`).join("")}</tr>`;
}

async function renderTraders() {
  const [rows, lb] = await Promise.all([api("traders"), fetch("/api/leaderboard?window=7d").then(r=>r.json())]);
  const cols = [{k:"handle",t:"trader"},{k:"hitRate",t:"hit rate"},{k:"appearances",t:"seen"},
    {k:"setups",t:"setups"},{k:"rejects",t:"rejects"},{k:"avgScore",t:"avg score"},
    {k:"bestScore",t:"best"},{k:"avgUsd",t:"avg buy"},{k:"lastSeen",t:"last"}];

  const note = `<div class="note"><b>Ranked by what actually happened here.</b> Hit rate = share of this
    trader's observed buys that cleared every hard gate. This is not their PnL — it is how often
    following them would have pointed at something that survived the on-chain checks.
    Traders with fewer than 3 appearances are down-weighted so one lucky call can't top the board.</div>`;

  const table = !rows.length ? `<div class="empty">No traders in the log yet.</div>` :
    `<table><thead>${headers("traders", cols)}</thead><tbody>` +
    sortRows(rows,"traders").map(t => `<tr>
      <td><b>${esc(t.handle ?? t.wallet.slice(0,10))}</b><div class="mono">${esc(t.wallet.slice(0,18))}…</div></td>
      <td><div class="bar"><i style="width:${(t.hitRate*100).toFixed(0)}%"></i></div>${(t.hitRate*100).toFixed(0)}%</td>
      <td>${t.appearances}</td><td>${t.setups}</td><td>${t.rejects}</td>
      <td>${t.avgScore}</td><td>${t.bestScore}</td><td>${fmtUsd(t.avgUsd)}</td>
      <td>${ago(t.lastSeen)}<div class="mono">${esc(t.chains.join(", "))}</div></td>
    </tr>`).join("") + `</tbody></table>`;

  const board = lb.available
    ? `<h4 style="color:var(--dim);font-size:10px;letter-spacing:1.2px;margin:26px 0 8px">FOMO LEADERBOARD (${esc(lb.window)}) — EXTERNAL VIEW</h4>
       <table><thead><tr><th>#</th><th>trader</th><th>pnl</th><th>volume</th><th>trades</th><th>followers</th></tr></thead><tbody>` +
       lb.traders.slice(0,40).map(t=>`<tr><td>${t.rank ?? ""}</td>
         <td><b>${esc(t.handle)}</b>${t.verified?' <span class="chip">verified</span>':""}</td>
         <td>${t.pnlUsd!=null?fmtUsd(t.pnlUsd):"—"}</td><td>${t.volumeUsd!=null?fmtUsd(t.volumeUsd):"—"}</td>
         <td>${t.trades ?? "—"}</td><td>${t.followers?.toLocaleString() ?? "—"}</td></tr>`).join("") + `</tbody></table>`
    : `<div class="note" style="border-left-color:var(--faint);margin-top:22px">FOMO leaderboard unavailable — ${esc(lb.reason)}</div>`;

  $("#view-traders").innerHTML = note + table + board;
}

async function renderTokens() {
  const rows = await api("tokens");
  const cols = [{k:"symbol",t:"token"},{k:"latestScore",t:"latest"},{k:"bestScore",t:"best"},
    {k:"evaluations",t:"evals"},{k:"lastSeen",t:"last seen"}];
  const note = `<div class="note"><b>History per token.</b> The bar shows every evaluation in order, so you
    can see a read change as evidence arrived — a token that improves once liquidity deepens looks very
    different from one that got vetoed the moment the pool was readable.</div>`;

  $("#view-tokens").innerHTML = note + (!rows.length ? `<div class="empty">No tokens yet.</div>` :
    `<table><thead>${headers("tokens", cols, ["history","buyers","failed"])}</thead><tbody>` +
    sortRows(rows,"tokens").map(t => `<tr>
      <td><b>${esc(t.symbol ?? t.address.slice(0,10))}</b> <span class="chip">${esc(t.chain)}</span>
        <div class="mono">${esc(t.address.slice(0,22))}…</div></td>
      <td><span class="badge ${t.latestLabel}">${t.latestLabel}</span> ${t.latestScore}</td>
      <td>${t.bestScore}</td><td>${t.evaluations}</td><td>${ago(t.lastSeen)}</td>
      <td><div class="spark">${t.history.slice(-24).map(h=>`<i class="${h.label}" style="height:${Math.max(3,h.score/100*22)}px" title="${h.score} ${h.label}"></i>`).join("")}</div></td>
      <td class="mono">${esc(t.buyers.slice(0,4).join(", "))}</td>
      <td class="mono" style="color:var(--bad)">${esc(t.failedChecks.join(", ")) || "—"}</td>
    </tr>`).join("") + `</tbody></table>`);
}

async function renderGates() {
  const rows = await api("gates");
  const cols = [{k:"name",t:"check"},{k:"vetoed",t:"vetoed"},{k:"fail",t:"fail"},
    {k:"warn",t:"warn"},{k:"pass",t:"pass"},{k:"unknown",t:"unknown"}];
  const note = `<div class="note"><b>Which checks are doing the work.</b> A gate that never fails is not
    protecting you; a gate that vetoes everything is mistuned. High <i>unknown</i> counts mean a data source
    is missing — those cost score rather than passing silently, so fixing them is usually the biggest
    single improvement available.</div>`;

  $("#view-gates").innerHTML = note + (!rows.length ? `<div class="empty">No evaluations yet.</div>` :
    `<table><thead>${headers("gates", cols, ["mix"])}</thead><tbody>` +
    sortRows(rows,"gates").map(g => {
      const tot = g.pass+g.fail+g.warn+g.unknown || 1;
      return `<tr><td><b>${esc(g.name)}</b></td>
        <td style="color:var(--bad)">${g.vetoed || "—"}</td><td>${g.fail}</td><td>${g.warn}</td>
        <td>${g.pass}</td><td>${g.unknown}</td>
        <td><div class="bar" style="display:flex">
          <i style="width:${g.pass/tot*100}%;background:var(--ok)"></i>
          <i style="width:${g.warn/tot*100}%;background:var(--warn)"></i>
          <i style="width:${g.fail/tot*100}%;background:var(--bad)"></i>
          <i style="width:${g.unknown/tot*100}%;background:var(--faint)"></i>
        </div></td></tr>`;
    }).join("") + `</tbody></table>`);
}

async function renderConfig() {
  const sum = await api("summary");
  const t = sum.thresholds;
  const row = (k,v) => `<tr><td class="mono">${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`;
  $("#view-config").innerHTML = `<div class="note">Live thresholds this server is running with.
    Every one is an environment variable — see <span class="mono">.env.example</span>. Changing them
    changes what gets flagged, so tune against the rejects in the log, not against a hunch.</div>
    <table><thead><tr><th>setting</th><th>value</th></tr></thead><tbody>
    ${row("min distinct buyers", t.signal.minDistinctBuyers)}
    ${row("consensus window", (t.signal.consensusWindowMs/60000)+" min")}
    ${row("min buy size", fmtUsd(t.signal.minBuyUsd))}
    ${row("min liquidity", fmtUsd(t.gates.minLiquidityUsd))}
    ${row("max top-10 holders", t.gates.maxTop10Percent+"%")}
    ${row("min holders", t.gates.minHolders)}
    ${row("max dev sold", t.gates.maxDevSoldPercent+"%")}
    ${row("min 5m buy/sell", t.gates.minBuySellRatio5m)}
    ${row("bankroll", fmtUsd(t.risk.bankrollUsd))}
    ${row("max position", t.risk.maxPositionPct+"% ("+fmtUsd(t.risk.bankrollUsd*t.risk.maxPositionPct/100)+")")}
    ${row("mirror fraction", (t.risk.mirrorFraction*100)+"% of the wallet's size")}
    ${row("max concurrent", t.risk.maxConcurrentPositions)}
    ${row("daily loss limit", t.risk.dailyLossLimitPct+"%")}
    ${row("cooldown", (t.risk.cooldownMs/60000)+" min")}
    </tbody></table>`;
}

document.addEventListener("click", (e) => {
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const [which, key] = th.dataset.sort.split(":");
    const st = sortState[which];
    st.dir = st.key === key ? -st.dir : -1;
    st.key = key;
    refresh();
    return;
  }
  const btn = e.target.closest("nav button");
  if (!btn) return;
  tab = btn.dataset.tab;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
  ["opps","traders","tokens","gates","config"].forEach(t => { $("#view-"+t).hidden = t !== tab; });
  refresh();
});

let debounce;
document.querySelector(".filters").addEventListener("input", () => {
  clearTimeout(debounce); debounce = setTimeout(refresh, 200);
});

refresh();
setInterval(() => { if ($("#f-auto").checked) refresh(); }, 10000);
</script>
</body>
</html>
