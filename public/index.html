<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perfecting</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d0e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2335e08a'/%3E%3C/svg%3E">
<style>
/* ─── design tokens ──────────────────────────────────────────────────────────
   Dark-only surface. Status hues are reserved for verdicts and never reused as
   series colors; the three tier hues are the validated categorical slots 1–3
   (blue / orange / aqua), which clear every all-pairs gate on this surface.
   Brand green is chrome only — logo, avatar ring, focus — never data.        */
:root{
  --bg:#080a0b;
  --surface:#0a0d0e;
  --raise:#0e1213;
  --raise-2:#141a1b;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.13);

  --ink:#eef2f0;
  --ink-2:#98a3a0;
  --ink-3:#5d6866;

  /* status — reserved */
  --good:#2fbf5f;
  --warn:#fab219;
  --crit:#e2504e;

  /* categorical — tiers */
  --t1:#3987e5;
  --t2:#d95926;
  --t3:#199e70;

  --brand:#35e08a;

  --sp:4px;
  --r-sm:7px; --r:11px; --r-lg:16px;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --rail:236px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(53,224,138,.22)}

/* ─── shell ───────────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}

aside{border-right:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.ident{position:relative;padding:30px 18px 18px;border-bottom:1px solid var(--line);overflow:hidden}
/* The banner is mostly black with fine light detail, so it needs a light hand:
   a strong veil erases it entirely. Weighted to clear behind the text only. */
.ident .bg{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:.72}
.ident .veil{position:absolute;inset:0;
  background:linear-gradient(175deg,rgba(8,10,11,.15) 0%,rgba(8,10,11,.55) 55%,rgba(8,10,11,.93) 100%)}
.ident-row{position:relative;display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:13px;object-fit:cover;flex:none;background:var(--raise-2);
  border:1px solid var(--line-strong);
  box-shadow:0 4px 16px rgba(0,0,0,.55),0 0 0 3px rgba(53,224,138,.10)}
.avatar.ph{display:grid;place-items:center;border-style:dashed;color:var(--ink-3);
  font:500 8px/1.3 var(--mono);text-align:center;padding:4px}
.wordmark{font:600 17px/1.2 var(--sans);letter-spacing:.2px;
  text-shadow:0 1px 6px rgba(0,0,0,.9)}
.wordmark i{color:var(--brand);font-style:normal;font-weight:400}
.role{font:400 11px/1.4 var(--mono);color:var(--ink-2);margin-top:3px;
  text-shadow:0 1px 6px rgba(0,0,0,.9)}

nav{padding:10px 10px;display:flex;flex-direction:column;gap:1px;flex:1}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  color:var(--ink-2);padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;
  font:500 13px/1 var(--sans);text-align:left;transition:background .14s,color .14s}
nav button:hover{background:var(--raise);color:var(--ink)}
nav button[aria-selected="true"]{background:var(--raise-2);color:var(--ink)}
nav button .ico{width:15px;text-align:center;font-size:12px;color:var(--ink-3);flex:none}
nav button[aria-selected="true"] .ico{color:var(--brand)}
nav button .n{margin-left:auto;font:500 11px/1 var(--mono);color:var(--ink-3)}

.sysbox{border-top:1px solid var(--line);padding:14px 18px;font:400 11px/1.7 var(--mono);color:var(--ink-3)}
.sysrow{display:flex;justify-content:space-between;gap:8px}
.sysrow b{color:var(--ink-2);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--good);box-shadow:0 0 7px rgba(47,191,95,.75)}
.dot.off{background:var(--ink-3)}

/* ─── main ────────────────────────────────────────────────────────────────── */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,10,11,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 26px 0}
.crumb{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.crumb h2{margin:0;font:600 17px/1.2 var(--sans);letter-spacing:-.1px}
.crumb p{margin:0;color:var(--ink-3);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:12px}
.field{display:flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:0 4px 0 9px;transition:border-color .14s}
.field:focus-within{border-color:var(--line-strong)}
.field span{font:500 10px/1 var(--sans);color:var(--ink-3);letter-spacing:.6px;text-transform:uppercase}
select,input{background:none;border:0;color:var(--ink);font:500 12px/1 var(--sans);padding:7px 4px;outline:none}
select{cursor:pointer}
option{background:var(--raise-2)}
input[type=search]{min-width:190px;font-family:var(--mono)}
.check{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:11px;cursor:pointer;
  padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--raise)}
.check input{accent-color:var(--brand);margin:0}
.wrap{padding:22px 26px 80px;max-width:1460px}

/* ─── stat tiles: the number IS the chart ─────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.tile .k{font:500 10px/1 var(--sans);color:var(--ink-3);letter-spacing:.7px;text-transform:uppercase}
.tile .v{font:600 25px/1.1 var(--mono);margin-top:7px;letter-spacing:-.5px}
.tile .v.good{color:var(--good)}.tile .v.warn{color:var(--warn)}.tile .v.crit{color:var(--crit)}
.tile .sub{font:400 10px/1 var(--mono);color:var(--ink-3);margin-top:5px}

/* ─── opportunity card ───────────────────────────────────────────────────── */
.card{border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;background:var(--surface);
  transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line-strong)}
.card[open]{background:var(--raise)}
summary{padding:14px 16px;cursor:pointer;display:grid;
  grid-template-columns:52px minmax(150px,1.1fr) minmax(210px,1.3fr) auto;
  gap:16px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
.scorecell{text-align:center}
.scorecell .n{font:600 26px/1 var(--mono);letter-spacing:-1px;display:block}
.scorecell .of{font:400 9px/1 var(--mono);color:var(--ink-3)}
.SETUP .scorecell .n{color:var(--good)}
.WATCH .scorecell .n{color:var(--warn)}
.REJECT .scorecell .n{color:var(--crit)}
.idcell .sym{font:600 15px/1.2 var(--sans);letter-spacing:.2px}
.idcell .sub{font:400 11px/1.4 var(--mono);color:var(--ink-3);margin-top:3px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:500 9px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;
  padding:3px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3)}
.verdict{font:600 9px/1 var(--sans);letter-spacing:.9px;padding:4px 9px;border-radius:20px}
.SETUP .verdict{background:rgba(47,191,95,.13);color:var(--good)}
.WATCH .verdict{background:rgba(250,178,25,.13);color:var(--warn)}
.REJECT .verdict{background:rgba(226,80,78,.12);color:var(--crit)}
.headline{color:var(--ink-2);font-size:12px;line-height:1.5}
.endcell{display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap}
.endcell time{font:400 11px/1 var(--mono);color:var(--ink-3)}

/* tier meters — direct-labeled, so hue never carries identity alone */
.meters{display:flex;flex-direction:column;gap:6px}
.meter{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.meter .lbl{display:flex;align-items:center;gap:6px;font:500 10px/1 var(--sans);color:var(--ink-2)}
.sw{width:7px;height:7px;border-radius:2px;flex:none}
.meter .val{font:500 10px/1 var(--mono);color:var(--ink-3)}
.track{grid-column:1/-1;height:4px;background:rgba(255,255,255,.055);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:0 4px 4px 0;transition:width .35s cubic-bezier(.4,0,.2,1)}

.body{padding:2px 16px 16px}
.meta{color:var(--ink-3);font:400 11px/1.7 var(--mono);padding:12px 0;margin-bottom:4px;
  border-top:1px solid var(--line);word-break:break-all}
.tier-group{margin-top:14px}
.tier-group h4{margin:0 0 8px;font:600 10px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:7px}
.evidence{display:grid;gap:1px}
.ck{display:grid;grid-template-columns:16px 132px 1fr;gap:10px;align-items:baseline;
  padding:5px 8px;border-radius:6px;font-size:12px}
.ck:hover{background:var(--raise-2)}
.ck .mk{text-align:center;font:600 11px/1.4 var(--mono)}
.ck.pass .mk{color:var(--good)}.ck.warn .mk{color:var(--warn)}
.ck.fail .mk{color:var(--crit)}.ck.unknown .mk{color:var(--ink-3)}
.ck b{font:500 12px/1.4 var(--mono);color:var(--ink-2)}
.ck .says{color:var(--ink-3);font-size:12px}
.ck .dq{color:var(--crit);font:600 9px/1 var(--sans);letter-spacing:.7px;margin-left:6px}
.ck.fail b{color:var(--ink)}

/* ─── tables ─────────────────────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--ink-3);font:600 10px/1 var(--sans);letter-spacing:.8px;
  text-transform:uppercase;padding:11px 13px;border-bottom:1px solid var(--line);
  cursor:pointer;white-space:nowrap;user-select:none;transition:color .14s}
th:hover{color:var(--ink)}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--raise)}
td.num{font:500 12px/1 var(--mono);text-align:right}
.who b{font:600 12px/1.3 var(--sans);display:block}
.who span{font:400 10px/1.3 var(--mono);color:var(--ink-3)}
.bar{height:5px;background:rgba(255,255,255,.055);border-radius:4px;overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-right:8px}
.bar i{display:block;height:100%;background:var(--good);border-radius:0 4px 4px 0}
.mix{display:flex;height:5px;border-radius:4px;overflow:hidden;width:110px;gap:2px}
.mix i{display:block;height:100%;border-radius:2px}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:4px;border-radius:2px;background:var(--ink-3);min-height:3px}
.spark i.SETUP{background:var(--good)}.spark i.WATCH{background:var(--warn)}.spark i.REJECT{background:var(--crit)}

/* ─── misc ───────────────────────────────────────────────────────────────── */
.note{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--brand);
  border-radius:var(--r);padding:13px 16px;margin-bottom:16px;color:var(--ink-2);font-size:12px;line-height:1.65}
.note b{color:var(--ink);font-weight:600}
.sectionhead{font:600 10px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-3);margin:30px 0 10px}
.empty{color:var(--ink-3);padding:16px 0 44px;text-align:center;font-size:12px}
.showcase{display:block;margin:26px auto 4px;max-width:720px;width:100%;
  border-radius:var(--r-lg);border:1px solid var(--line)}
.showcase-fb{max-width:720px;margin:26px auto 4px;padding:52px 22px;text-align:center;
  border:1px dashed var(--line-strong);border-radius:var(--r-lg);color:var(--ink-3);
  font:400 12px/2 var(--mono)}
.showcase-fb b{color:var(--ink-2)}
.skel{height:64px;background:linear-gradient(90deg,var(--surface),var(--raise),var(--surface));
  background-size:200% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:var(--r);margin-bottom:9px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

#tip{position:fixed;z-index:99;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--raise-2);border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 10px;font:400 11px/1.5 var(--mono);color:var(--ink);max-width:280px;
  box-shadow:0 8px 26px rgba(0,0,0,.6)}
#tip.on{opacity:1}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;overflow-x:auto}
  nav button .n{display:none}
  summary{grid-template-columns:46px 1fr;gap:12px}
  .meters,.endcell{grid-column:1/-1;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="ident">
    <div class="bg" id="hero-bg"></div><div class="veil"></div>
    <div class="ident-row">
      <img class="avatar" id="avatar" alt="" hidden>
      <div class="avatar ph" id="avatar-ph">avatar<br>.png</div>
      <div>
        <div class="wordmark">perfecting<i>_</i></div>
        <div class="role">setup scanner</div>
      </div>
    </div>
  </div>
  <nav id="tabs">
    <button data-tab="opps" aria-selected="true"><span class="ico">◈</span>Opportunities<span class="n" id="n-opps"></span></button>
    <button data-tab="traders" aria-selected="false"><span class="ico">◇</span>Traders<span class="n" id="n-traders"></span></button>
    <button data-tab="tokens" aria-selected="false"><span class="ico">◎</span>Tokens<span class="n" id="n-tokens"></span></button>
    <button data-tab="gates" aria-selected="false"><span class="ico">▤</span>Gates</button>
    <button data-tab="config" aria-selected="false"><span class="ico">⚙</span>Config</button>
  </nav>
  <div class="sysbox">
    <div class="sysrow"><span id="scanner-state"><span class="dot off"></span>checking…</span></div>
    <div class="sysrow"><span>chains</span><b id="sys-chains">—</b></div>
    <div class="sysrow"><span>evaluations</span><b id="sys-evals">—</b></div>
  </div>
</aside>

<main>
  <div class="topbar">
    <div class="crumb"><h2 id="page-title">Opportunities</h2><p id="page-sub"></p></div>
    <div class="filters">
      <div class="field"><span>chain</span><select id="f-chain"><option value="all">all</option><option>robinhood</option><option>solana</option><option>base</option><option>bsc</option></select></div>
      <div class="field"><span>found by</span><select id="f-source"><option value="all">all</option><option value="stream">smart money</option><option value="discovery">volume</option></select></div>
      <div class="field"><span>verdict</span><select id="f-label"><option value="all">all</option><option>SETUP</option><option>WATCH</option><option>REJECT</option></select></div>
      <div class="field"><span>score</span><select id="f-score"><option value="0">any</option><option value="45">45+</option><option value="70">70+</option><option value="85">85+</option></select></div>
      <div class="field"><span>window</span><select id="f-since"><option value="0">all</option><option value="1">1h</option><option value="6">6h</option><option value="24">24h</option><option value="168">7d</option></select></div>
      <div class="field"><input type="search" id="f-q" placeholder="token, address, trader…"></div>
      <label class="check"><input type="checkbox" id="f-auto" checked>live</label>
    </div>
  </div>
  <div class="wrap">
    <div id="view-opps"></div>
    <div id="view-traders" hidden></div>
    <div id="view-tokens" hidden></div>
    <div id="view-gates" hidden></div>
    <div id="view-config" hidden></div>
  </div>
</main>
</div>
<div id="tip"></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MARK = { pass:"✓", warn:"!", fail:"✕", unknown:"·" };
const TIER = { 1:{name:"On-chain truth",  v:"--t1"},
               2:{name:"Smart money",     v:"--t2"},
               3:{name:"Social",          v:"--t3"} };
const PAGE = {
  opps:   ["Opportunities","every evaluation, newest first — rejects included"],
  traders:["Traders","ranked by what actually cleared the gates here"],
  tokens: ["Tokens","one row per token, with how the read changed over time"],
  gates:  ["Gates","which checks are doing the rejecting"],
  config: ["Config","the thresholds this process is running with"],
};
const usd = n => "$" + Math.round(n).toLocaleString();
const ago = t => { const s=(Date.now()-t)/1000;
  if(s<60) return Math.round(s)+"s"; if(s<3600) return Math.round(s/60)+"m";
  if(s<86400) return Math.round(s/3600)+"h"; return Math.round(s/86400)+"d"; };

let tab = "opps";
let sortState = { traders:{key:"hitRate",dir:-1}, tokens:{key:"lastSeen",dir:-1}, gates:{key:"vetoed",dir:-1} };

/* ── your images drive the identity; both optional ── */
const ASSETS = { avatar:"/assets/avatar.png", banner:"/assets/banner.png" };
const have = { avatar:false, banner:false };
async function loadIdentity(){
  const r = await fetch("/api/assets").then(r=>r.json()).catch(()=>({}));
  have.avatar = !!r.avatar; have.banner = !!r.banner;
  if (have.avatar){ const i=$("#avatar"); i.src=ASSETS.avatar; i.hidden=false; $("#avatar-ph").style.display="none";
    $("#favicon").href = ASSETS.avatar; }
  if (have.banner) $("#hero-bg").style.backgroundImage = `url("${ASSETS.banner}")`;
}
const showcase = () => have.banner
  ? `<img class="showcase" src="${ASSETS.banner}" alt="">`
  : `<div class="showcase-fb">drop <b>avatar.png</b> and <b>banner.png</b> into <b>public/assets/</b><br>they appear here and in the sidebar automatically</div>`;

/* ── hover layer ── */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el){ tip.classList.remove("on"); return; }
  tip.textContent = el.dataset.tip;
  tip.classList.add("on");
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + pad, innerWidth - w - 8) + "px";
  tip.style.top  = Math.max(8, e.clientY - h - pad) + "px";
});

function query(){
  const p = new URLSearchParams();
  p.set("chain",$("#f-chain").value); p.set("label",$("#f-label").value);
  p.set("minScore",$("#f-score").value); p.set("sinceHours",$("#f-since").value);
  p.set("source",$("#f-source").value);
  const q=$("#f-q").value.trim(); if(q) p.set("q",q);
  return p.toString();
}
const api = p => fetch(`/api/${p}?${query()}`).then(r=>r.json());

async function refresh(){
  const [t,s] = PAGE[tab]; $("#page-title").textContent = t; $("#page-sub").textContent = s;
  try{
    const h = await fetch("/api/health").then(r=>r.json());
    $("#scanner-state").innerHTML = `<span class="dot ${h.scanner?"on":"off"}"></span>` +
      (h.scanner ? `scanner live · ${esc(h.mode)}` : `scanner idle`);
    $("#sys-evals").textContent = h.evaluations;
  }catch{ $("#scanner-state").innerHTML = `<span class="dot off"></span>server down`; }

  if(tab==="opps") return renderOpps();
  if(tab==="traders") return renderTraders();
  if(tab==="tokens") return renderTokens();
  if(tab==="gates") return renderGates();
  if(tab==="config") return renderConfig();
}

function tierMeters(a){
  return `<div class="meters">` + [1,2,3].map(n=>{
    const items=a.evidence.filter(e=>e.tier===n);
    if(!items.length) return "";
    const got=items.reduce((x,e)=>x+e.points,0), max=items.reduce((x,e)=>x+e.maxPoints,0);
    const pct = max? Math.max(0,Math.min(100,got/max*100)) : 0;
    const fails=items.filter(e=>e.verdict==="fail").length, unk=items.filter(e=>e.verdict==="unknown").length;
    const tipTxt=`${TIER[n].name}: ${got.toFixed(0)} of ${max.toFixed(0)} pts`
      + (fails?` · ${fails} failing`:"") + (unk?` · ${unk} unmeasured`:"");
    return `<div class="meter" data-tip="${esc(tipTxt)}">
      <span class="lbl"><i class="sw" style="background:var(${TIER[n].v})"></i>${TIER[n].name}</span>
      <span class="val">${got.toFixed(0)}/${max.toFixed(0)}</span>
      <span class="track"><i style="width:${pct}%;background:var(${TIER[n].v})"></i></span>
    </div>`;
  }).join("") + `</div>`;
}

async function renderOpps(){
  $("#view-opps").innerHTML = `<div class="skel"></div><div class="skel"></div>`;
  const [rows,sum] = await Promise.all([api("setups"),api("summary")]);
  $("#n-opps").textContent = sum.evaluations || "";
  $("#sys-chains").textContent = sum.chains?.join(", ") || "—";

  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">evaluations</div><div class="v">${sum.evaluations}</div><div class="sub">rejects included</div></div>
    <div class="tile"><div class="k">setups</div><div class="v good">${sum.setups}</div><div class="sub">cleared every gate</div></div>
    <div class="tile"><div class="k">watch</div><div class="v warn">${sum.watches}</div><div class="sub">nothing disqualifying</div></div>
    <div class="tile"><div class="k">rejected</div><div class="v crit">${sum.rejects}</div><div class="sub">vetoed or too weak</div></div>
    <div class="tile"><div class="k">avg score</div><div class="v">${sum.avgScore}</div><div class="sub">of 100</div></div>
    <div class="tile"><div class="k">blind spots</div><div class="v">${sum.blindSpotsPerEval}</div><div class="sub">per evaluation</div></div>
  </div>`;

  if(!rows.length){ $("#view-opps").innerHTML = tiles + showcase() + `<div class="empty">No evaluations match these filters.</div>`; return; }

  $("#view-opps").innerHTML = tiles + rows.map(r=>{
    const s=r.setup, a=r.assessment;
    const groups=[1,2,3].map(n=>{
      const items=a.evidence.filter(e=>e.tier===n); if(!items.length) return "";
      return `<div class="tier-group"><h4><i class="sw" style="background:var(${TIER[n].v})"></i>${TIER[n].name}</h4>
        <div class="evidence">` + items.map(e=>`<div class="ck ${e.verdict}">
          <span class="mk">${MARK[e.verdict]}</span><b>${esc(e.name)}</b>
          <span class="says">${esc(e.says)}${e.veto&&e.verdict==="fail"?'<span class="dq">DISQUALIFYING</span>':""}</span>
        </div>`).join("") + `</div></div>`;
    }).join("");

    return `<details class="card ${a.label}"${a.label==="SETUP"?" open":""}>
      <summary>
        <span class="scorecell"><span class="n">${a.score}</span><span class="of">/100</span></span>
        <span class="idcell">
          <span class="sym">${esc(s.token.symbol ?? s.token.address.slice(0,10))}</span>
          <span class="sub"><span class="pill">${esc(s.chain)}</span>${
            (s.source ?? "stream") === "discovery"
              ? `<span class="pill" data-tip="Found by 24h volume, not by a tracked wallet — there is no smart-money confirmation here">by volume</span>`
                + (s.volume24hUsd ? `<span class="pill">${usd(s.volume24hUsd)} 24h</span>` : "")
              : `<span class="pill">${s.buyers.length} wallets</span>`
          }</span>
        </span>
        ${tierMeters(a)}
        <span class="endcell">
          <span class="verdict">${a.label}</span>
          <time data-tip="${esc(new Date(r.at).toLocaleString())}">${ago(r.at)} ago</time>
        </span>
      </summary>
      <div class="body">
        <div class="headline" style="padding:4px 0 2px">${esc(a.headline)}</div>
        <div class="meta">${esc(s.token.address)}${
          s.buyers.length ? " · " + esc(s.buyers.map(b=>b.handle??b.wallet.slice(0,8)).join(", ")) + ` · lead ${s.leadMs}ms` : " · no tracked wallet involved"
        }${s.priceUsd ? ` · unit $${Number(s.priceUsd).toPrecision(4)}` : ""}${
          s.marketCapUsd ? ` · mcap ${usd(s.marketCapUsd)}` : ""
        }${s.change24h != null ? ` · ${s.change24h > 0 ? "+" : ""}${Number(s.change24h).toFixed(1)}% 24h` : ""}</div>
        ${groups}
      </div></details>`;
  }).join("");
}

const sortRows=(rows,w)=>{const{key,dir}=sortState[w];return[...rows].sort((a,b)=>{
  const x=a[key],y=b[key]; return typeof x==="string"?dir*x.localeCompare(y):dir*((x??0)-(y??0));});};
const headers=(w,cols,extra=[])=>`<tr>${cols.map(c=>
  `<th data-sort="${w}:${c.k}">${c.t}${sortState[w].key===c.k?(sortState[w].dir<0?" ↓":" ↑"):""}</th>`).join("")
  }${extra.map(t=>`<th>${t}</th>`).join("")}</tr>`;

async function renderTraders(){
  const [rows,lb]=await Promise.all([api("traders"),fetch("/api/leaderboard?window=7d").then(r=>r.json())]);
  $("#n-traders").textContent = rows.length || "";
  const cols=[{k:"handle",t:"trader"},{k:"hitRate",t:"hit rate"},{k:"appearances",t:"seen"},
    {k:"setups",t:"setups"},{k:"rejects",t:"rejects"},{k:"avgScore",t:"avg"},{k:"bestScore",t:"best"},
    {k:"avgUsd",t:"avg buy"},{k:"lastSeen",t:"last"}];

  const note=`<div class="note"><b>Ranked by what actually happened here.</b> Hit rate is the share of
    this trader's observed buys that cleared every hard gate — not their PnL. It answers
    "would following them have pointed at something that survived the on-chain checks?", which is
    the question that matters for copying. Under 3 appearances is down-weighted so one lucky call can't top the board.</div>`;

  const table = !rows.length ? `<div class="empty">No traders in the log yet.</div>` :
    `<div class="panel"><table><thead>${headers("traders",cols)}</thead><tbody>` +
    sortRows(rows,"traders").map(t=>`<tr>
      <td class="who"><b>${esc(t.handle??t.wallet.slice(0,10))}</b><span>${esc(t.chains.join(" · "))}</span></td>
      <td data-tip="${t.setups} of ${t.appearances} appearances cleared every gate">
        <span class="bar"><i style="width:${(t.hitRate*100).toFixed(0)}%"></i></span><span class="num">${(t.hitRate*100).toFixed(0)}%</span></td>
      <td class="num">${t.appearances}</td><td class="num">${t.setups}</td><td class="num">${t.rejects}</td>
      <td class="num">${t.avgScore}</td><td class="num">${t.bestScore}</td><td class="num">${usd(t.avgUsd)}</td>
      <td class="num">${ago(t.lastSeen)}</td></tr>`).join("") + `</tbody></table></div>`;

  const board = lb.available
    ? `<div class="sectionhead">FOMO leaderboard · ${esc(lb.window)} · external view</div>
       <div class="panel"><table><thead><tr><th>#</th><th>trader</th><th>pnl</th><th>volume</th><th>trades</th><th>followers</th></tr></thead><tbody>` +
       (lb.traders||[]).slice(0,40).map(t=>`<tr><td class="num">${t.rank??""}</td>
        <td class="who"><b>${esc(t.handle)}</b>${t.verified?`<span>verified</span>`:""}</td>
        <td class="num">${t.pnlUsd!=null?usd(t.pnlUsd):"—"}</td><td class="num">${t.volumeUsd!=null?usd(t.volumeUsd):"—"}</td>
        <td class="num">${t.trades??"—"}</td><td class="num">${t.followers?.toLocaleString()??"—"}</td></tr>`).join("")
       + `</tbody></table></div>`
    : `<div class="sectionhead">FOMO leaderboard</div><div class="note" style="border-left-color:var(--line-strong)">Unavailable — ${esc(lb.reason??"")}</div>`;

  $("#view-traders").innerHTML = note + table + board;
}

async function renderTokens(){
  const rows=await api("tokens");
  $("#n-tokens").textContent = rows.length || "";
  const cols=[{k:"symbol",t:"token"},{k:"latestScore",t:"latest"},{k:"bestScore",t:"best"},
    {k:"evaluations",t:"evals"},{k:"lastSeen",t:"last seen"}];
  const note=`<div class="note"><b>History per token.</b> Each bar is one evaluation in order, coloured by
    verdict — a token that improves once liquidity deepens looks nothing like one vetoed the moment its
    pool became readable.</div>`;
  $("#view-tokens").innerHTML = note + (!rows.length ? `<div class="empty">No tokens yet.</div>` :
    `<div class="panel"><table><thead>${headers("tokens",cols,["history","buyers","failed"])}</thead><tbody>` +
    sortRows(rows,"tokens").map(t=>`<tr>
      <td class="who"><b>${esc(t.symbol??t.address.slice(0,10))}</b><span>${esc(t.chain)} · ${esc(t.address.slice(0,16))}…</span></td>
      <td><span class="verdict" style="background:none;padding:0;color:var(--${t.latestLabel==="SETUP"?"good":t.latestLabel==="WATCH"?"warn":"crit"})">${t.latestScore}</span></td>
      <td class="num">${t.bestScore}</td><td class="num">${t.evaluations}</td><td class="num">${ago(t.lastSeen)}</td>
      <td><span class="spark">${t.history.slice(-24).map(h=>
        `<i class="${h.label}" style="height:${Math.max(3,h.score/100*24)}px" data-tip="${h.score}/100 · ${h.label} · ${new Date(h.at).toLocaleTimeString()}"></i>`).join("")}</span></td>
      <td><span class="mono" style="color:var(--ink-3);font:400 11px var(--mono)">${esc(t.buyers.slice(0,3).join(", "))}</span></td>
      <td><span style="color:var(--crit);font:400 11px var(--mono)">${esc(t.failedChecks.join(", "))||"—"}</span></td>
    </tr>`).join("") + `</tbody></table></div>`);
}

async function renderGates(){
  const rows=await api("gates");
  const cols=[{k:"name",t:"check"},{k:"vetoed",t:"vetoed"},{k:"fail",t:"fail"},
    {k:"warn",t:"warn"},{k:"pass",t:"pass"},{k:"unknown",t:"unmeasured"}];
  const note=`<div class="note"><b>Which checks are doing the work.</b> A gate that never fails isn't
    protecting you; one that vetoes everything is mistuned. A high <b>unmeasured</b> count means a data
    source is missing — those cost score rather than passing silently, so wiring them is usually the
    single biggest improvement available.</div>`;
  $("#view-gates").innerHTML = note + (!rows.length ? `<div class="empty">No evaluations yet.</div>` :
    `<div class="panel"><table><thead>${headers("gates",cols,["mix"])}</thead><tbody>` +
    sortRows(rows,"gates").map(g=>{
      const tot=g.pass+g.fail+g.warn+g.unknown||1;
      const seg=(n,c,l)=> n? `<i style="flex:${n};background:${c}" data-tip="${l}: ${n} of ${tot}"></i>`:"";
      return `<tr><td><b style="font:500 12px var(--mono)">${esc(g.name)}</b></td>
        <td class="num" style="color:${g.vetoed?"var(--crit)":"var(--ink-3)"}">${g.vetoed||"—"}</td>
        <td class="num">${g.fail}</td><td class="num">${g.warn}</td><td class="num">${g.pass}</td>
        <td class="num">${g.unknown}</td>
        <td><span class="mix">${seg(g.pass,"var(--good)","pass")}${seg(g.warn,"var(--warn)","warn")}${seg(g.fail,"var(--crit)","fail")}${seg(g.unknown,"var(--ink-3)","unmeasured")}</span></td>
      </tr>`;}).join("") + `</tbody></table></div>`);
}

async function renderConfig(){
  const sum=await api("summary"); const t=sum.thresholds;
  const row=(k,v,n="")=>`<tr><td style="color:var(--ink-2)">${esc(k)}</td>
    <td class="num" style="color:var(--ink)">${esc(v)}</td>
    <td style="color:var(--ink-3);font-size:11px">${esc(n)}</td></tr>`;
  $("#view-config").innerHTML = `<div class="note">Live thresholds this process is running with. Every one is an
    environment variable — see <b>.env.example</b>. Tune against the rejects in the log, not against a hunch.</div>
    <div class="sectionhead">signal</div><div class="panel"><table><tbody>
    ${row("min distinct buyers",t.signal.minDistinctBuyers,"wallets, not prints")}
    ${row("consensus window",(t.signal.consensusWindowMs/60000)+" min","")}
    ${row("min buy size",usd(t.signal.minBuyUsd),"ignore dust from tracked wallets")}
    </tbody></table></div>
    <div class="sectionhead">hard gates</div><div class="panel"><table><tbody>
    ${row("min liquidity",usd(t.gates.minLiquidityUsd),"")}
    ${row("max top-10 holders",t.gates.maxTop10Percent+"%","concentration veto")}
    ${row("min holders",t.gates.minHolders,"")}
    ${row("max dev sold",t.gates.maxDevSoldPercent+"%","veto")}
    ${row("min 5m buy/sell",t.gates.minBuySellRatio5m,"")}
    </tbody></table></div>
    <div class="sectionhead">risk</div><div class="panel"><table><tbody>
    ${row("bankroll",usd(t.risk.bankrollUsd),"")}
    ${row("max position",t.risk.maxPositionPct+"%",usd(t.risk.bankrollUsd*t.risk.maxPositionPct/100)+" per trade")}
    ${row("mirror fraction",(t.risk.mirrorFraction*100)+"%","of the wallet's own size — never 1:1")}
    ${row("max concurrent",t.risk.maxConcurrentPositions,"")}
    ${row("daily loss limit",t.risk.dailyLossLimitPct+"%","kill switch")}
    ${row("cooldown",(t.risk.cooldownMs/60000)+" min","per token, after exit or flag")}
    </tbody></table></div>`;
}

document.addEventListener("click", e=>{
  const th=e.target.closest("th[data-sort]");
  if(th){ const[w,k]=th.dataset.sort.split(":"); const st=sortState[w];
    st.dir = st.key===k ? -st.dir : -1; st.key=k; refresh(); return; }
  const b=e.target.closest("nav button"); if(!b) return;
  tab=b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  ["opps","traders","tokens","gates","config"].forEach(t=>{ $("#view-"+t).hidden = t!==tab; });
  refresh();
});
let deb; $(".filters").addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(refresh,200);});

await loadIdentity();
refresh();
setInterval(()=>{ if($("#f-auto").checked) refresh(); },10000);
</script>
</body>
